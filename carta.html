      <div class="letter-seal">&#128081;</div>

      <p class="letter-body">
        [ Escribe aquí tu carta para Paz. ]
      </p>

      <p class="signature">Con todo mi cariño,<br>Felipe</p>

      <div class="letter-photo">
        <img src="images/carta/IMG_20260730_222559_858.jpg" alt="Paz y Felipe">

    </div>
