<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una carta para Paz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Quicksand:wght@400;600;700&family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="stars-bg"></canvas>
  <div id="petals"></div>

  <main class="letter-page">
    <a href="index.html" class="back-link">&#8592; volver</a>

    <div class="letter-paper">
      <div class="letter-seal">&#128081;</div>
      <h1>Para mi princesa</h1>
      <p class="letter-to">Paz</p>

      <p class="letter-body">
        [ Escribe aquí tu carta para Paz. ]
      </p>

      <p class="signature">Con todo mi cariño,<br>Felipe</p>

      <div class="letter-photo">
        <img src="images/carta/IMG_20260730_222559_858.jpg" alt="Paz y Felipe">
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
