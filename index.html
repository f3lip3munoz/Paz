<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paz 👑 Felipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="stars-bg"></canvas>
  <div id="petals"></div>

  <header class="hero">
    <p class="eyebrow">&#10022; desde el 25 de abril de 2026, 2:00 PM &#10022;</p>
    <p class="princess-tag">&#128081; mi princesa &#128081;</p>
    <h1><span class="crown">&#128081;</span>Paz <button id="heart-btn" class="heart" aria-label="Presiona el corazon">&#10084;</button> Felipe</h1>

    <div id="counter" class="counter" aria-live="polite">
      <div class="unit"><span id="days">0000</span><small>días</small></div>
      <div class="unit"><span id="hours">00</span><small>horas</small></div>
      <div class="unit"><span id="minutes">00</span><small>min</small></div>
      <div class="unit"><span id="seconds">00</span><small>seg</small></div>
    </div>
    <p class="subtitle">y contando, princesa...</p>

    <button id="surprise-btn" class="surprise-btn">&#9733; mensaje sorpresa &#9733;</button>
    <p id="surprise-message" class="surprise-message"></p>
  </header>

  <main>
    <section class="memories">
      <h2>Recuerdos</h2>
      <p class="hint">(toca una foto para verla en grande)</p>

      <div class="category">
        <h3>✈️ Viajes</h3>
        <div class="gallery" id="gallery-viajes"></div>
      </div>

      <div class="category">
        <h3>💛 Momentos</h3>
        <div class="gallery" id="gallery-momentos"></div>
      </div>

      <div class="category">
        <h3>😂 Comedia</h3>
        <div class="gallery" id="gallery-comedia"></div>
      </div>
    </section>

    <section class="letter-link">
      <a href="carta.html" class="letter-seal-button" aria-label="Abrir mi carta para ti">
        <span class="envelope">&#9993;</span>
        <span class="wax-seal">&#128081;</span>
      </a>
    </section>
  </main>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button id="lightbox-close" class="lightbox-close" aria-label="Cerrar">&times;</button>
    <img id="lightbox-img" src="" alt="Recuerdo ampliado">
  </div>

  <footer>
    <p>hecho con &#10084; por Felipe</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
