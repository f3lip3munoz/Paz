<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paz & Felipe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <p class="eyebrow">desde el 25 de abril de 2026, 2:00 PM</p>
    <h1>Paz <span class="heart">&#10084;</span> Felipe</h1>
    <div id="counter" class="counter" aria-live="polite">
      <div class="unit"><span id="days">0</span><small>días</small></div>
      <div class="unit"><span id="hours">0</span><small>horas</small></div>
      <div class="unit"><span id="minutes">0</span><small>min</small></div>
      <div class="unit"><span id="seconds">0</span><small>seg</small></div>
    </div>
    <p class="subtitle">y contando...</p>
  </header>

  <main>
    <section class="memories">
      <h2>Recuerdos</h2>

      <div class="category">
        <h3>✈️ Viajes</h3>
        <div class="gallery" id="gallery-viajes">
          <div class="photo-placeholder">
            <span>Foto pendiente</span>
          </div>
        </div>
      </div>

      <div class="category">
        <h3>💛 Momentos</h3>
        <div class="gallery" id="gallery-momentos">
          <div class="photo-placeholder">
            <span>Foto pendiente</span>
          </div>
        </div>
      </div>

      <div class="category">
        <h3>😂 Comedia</h3>
        <div class="gallery" id="gallery-comedia">
          <div class="photo-placeholder">
            <span>Foto pendiente</span>
          </div>
        </div>
      </div>
    </section>

    <section class="letter-link">
      <a href="carta.html" class="letter-button">Abrir mi carta para ti &#8594;</a>
    </section>
  </main>

  <footer>
    <p>hecho con &#10084; por Felipe</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
